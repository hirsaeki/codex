name: apply-patch scoped helper reuse verify

on:
  push:
    branches:
      - perf/apply-patch-scoped-fs-helper-reuse
    paths:
      - '.github/workflows/apply-patch-scoped-reuse-verify.yml'
      - 'codex-rs/core/src/tools/runtimes/apply_patch.rs'
      - 'codex-rs/core/tests/windows_apply_patch_baseline.rs'
      - 'codex-rs/exec-server/src/fs_helper_main.rs'
      - 'codex-rs/exec-server/src/fs_sandbox.rs'
      - 'codex-rs/exec-server/src/lib.rs'
      - 'codex-rs/exec-server/src/local_file_system.rs'
      - 'codex-rs/exec-server/src/sandboxed_file_system.rs'
      - 'codex-rs/file-system/**'
      - 'codex-rs/sandboxing/**'
      - 'codex-rs/windows-sandbox-rs/**'
      - 'codex-rs/apply-patch/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-apply-patch:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Build Windows sandbox helpers
        shell: pwsh
        run: cargo build -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner

      - name: Build P0 harness without running
        shell: pwsh
        run: cargo test -p codex-core --test windows_apply_patch_baseline --no-run

      - name: Prepare P0 measurement environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $debugDir = Join-Path $metadata.target_directory 'debug'
          $codexHome = Join-Path $env:RUNNER_TEMP 'codex-apply-patch-scoped-reuse-home'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $codexHome
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null
          "CODEX_HOME=$codexHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$debugDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify scoped helper reuse with the P0 harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $depsDir = Join-Path $metadata.target_directory 'debug\deps'
          $testExe = Get-ChildItem -Path $depsDir -Filter 'windows_apply_patch_baseline-*.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $testExe) {
            throw 'windows_apply_patch_baseline test executable was not found'
          }

          $artifactDir = Join-Path $env:RUNNER_TEMP 'apply-patch-scoped-reuse'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $rawLog = Join-Path $artifactDir 'harness.log'

          & $testExe.FullName --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $rawLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Host '--- P0 harness failure tail ---'
            Get-Content $rawLog -Tail 100
            exit $testExit
          }

      - name: Upload P0 harness output
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apply-patch-scoped-reuse-harness-${{ github.sha }}
          path: ${{ runner.temp }}/apply-patch-scoped-reuse
          if-no-files-found: warn
          retention-days: 7
