                .expect("setup flights initialized")
                .lock()
                .unwrap_or_else(std::sync::PoisonError::into_inner)
                .get("cached-concurrent-success")
                .is_some_and(|flight| Arc::strong_count(flight) >= 3);
            if attached {
                break;
            }
            assert!(Instant::now() < deadline, "waiter did not join setup flight");
            thread::yield_now();
        }

        release_tx.send(()).expect("release leader");
        leader.join().expect("leader thread").expect("leader result");
        waiter.join().expect("waiter thread").expect("waiter result");
        assert_eq!(runs.load(Ordering::SeqCst), 1);
    }

