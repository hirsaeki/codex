name: P1 bootstrap

on:
  push:
    branches:
      - perf/cache-windows-sandbox-setup-refresh
    paths:
      - .github/workflows/p1-bootstrap.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply P1 cache changes
        run: python .github/p1_bootstrap.py
      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all
      - name: Run Windows sandbox unit tests
        working-directory: codex-rs
        run: cargo test -p codex-windows-sandbox --lib
      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          rm .github/workflows/p1-bootstrap.yml .github/p1_bootstrap.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codex-rs/windows-sandbox-rs/src/setup.rs codex-rs/windows-sandbox-rs/src/identity.rs .github/workflows/p1-bootstrap.yml .github/p1_bootstrap.py
          git commit -m "Cache successful Windows sandbox setup refreshes"
          git push origin HEAD:perf/cache-windows-sandbox-setup-refresh
