name: tmp main sandbox baseline

on:
  push:
    branches:
      - automation/apply-patch-batch-work
    paths:
      - .github/workflows/tmp-main-sandbox-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare bubblewrap and legacy Landlock on untouched main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "main=$(git rev-parse HEAD)"
          id
          command -v bwrap || true
          bwrap --version || true
          cat /proc/sys/kernel/unprivileged_userns_clone || true
          cat /proc/sys/user/max_user_namespaces || true
          ulimit -s || true
          cd codex-rs

          set +e
          RUST_BACKTRACE=1 cargo test -p codex-exec-server --test file_system_unix file_system_write_file_writes_bytes -- --nocapture
          default_status=$?
          set -e
          echo "DEFAULT_SANDBOX_STATUS=$default_status"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('exec-server/tests/file_system/support.rs')
          s = p.read_text()
          old = '''    if cfg!(windows) {
              sandbox.windows_sandbox_level = WindowsSandboxLevel::RestrictedToken;
          }
          sandbox
          }'''
          new = '''    if cfg!(windows) {
              sandbox.windows_sandbox_level = WindowsSandboxLevel::RestrictedToken;
          }
          #[cfg(target_os = "linux")]
          {
              sandbox.use_legacy_landlock = true;
          }
          sandbox
          }'''
          if s.count(old) != 1:
              raise RuntimeError(f'sandbox_context tail mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          RUST_BACKTRACE=1 cargo test -p codex-exec-server --test file_system_unix file_system_write_file_writes_bytes -- --nocapture
