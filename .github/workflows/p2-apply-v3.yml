name: Apply P2 implementation v3
on:
  push:
    branches: [automation/p2-apply]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: perf/apply-patch-refresh-in-process-p2
          fetch-depth: 0
      - name: Apply P2
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path.cwd()
          ws = root / "codex-rs/windows-sandbox-rs/src"

          def must_replace(s, old, new, label):
              if old not in s:
                  raise SystemExit(f"missing {label}")
              return s.replace(old, new, 1)

          (ws / "bin/setup_main/win.rs").rename(ws / "setup_impl.rs")
          (ws / "bin/setup_main/win").rename(ws / "setup_impl")
          (ws / "bin/setup_main/win_acl_tests.rs").rename(ws / "setup_impl_acl_tests.rs")

          p = ws / "setup_impl.rs"
          s = p.read_text()
          s = s.replace('#[path = "win_acl_tests.rs"]', '#[path = "setup_impl_acl_tests.rs"]')
          start = s.index("struct Payload {")
          end = s.index("\n}\n\n#[derive(Debug, Clone, Copy, Deserialize, Serialize, PartialEq, Eq, Default)]", start)
          block = s[start:end]
          block = block.replace("struct Payload {", "pub(crate) struct Payload {", 1)
          block = re.sub(r"(?m)^(    )(?!#)([a-z][a-z0-9_]*: )", r"\1pub(crate) \2", block)
          s = s[:start] + block + s[end:]
          s = must_replace(s, "enum SetupMode {", "pub(crate) enum SetupMode {", "SetupMode")
          s = must_replace(s, 'let exe = std::env::current_exe().context("locate setup helper")?;', 'let exe = crate::setup::find_setup_exe();', "read-acl exe")
          real = s.index("fn real_main() -> Result<()> {")
          body_start = s.index("    if payload.version != SETUP_VERSION {", real)
          next_fn = s.index("\nfn run_setup(", body_start)
          body = s[body_start:next_fn].rstrip()
          if not body.endswith("\n}"):
              raise SystemExit("unexpected real_main")
          body = body[:-2].rstrip() + "\n"
          body = body.replace("let result = run_setup(&payload, &mut log, &sbx_dir);", "let result = run_setup(payload, &mut log, &sbx_dir);", 1)
          shared = "    run_payload(&payload)\n}\n\npub(crate) fn run_payload(payload: &Payload) -> Result<()> {\n" + body + "}\n"
          s = s[:body_start] + shared + s[next_fn:]
          p.write_text(s)

          p = ws / "lib.rs"
          s = p.read_text()
          s = must_replace(s, '#![allow(unsafe_op_in_unsafe_fn)]\n', '#![allow(unsafe_op_in_unsafe_fn)]\n\nextern crate self as codex_windows_sandbox;\n', "self alias")
          s = must_replace(s, '#[cfg(target_os = "windows")]\nmod setup;\n', '#[cfg(target_os = "windows")]\nmod setup;\n\n#[cfg(target_os = "windows")]\nmod setup_impl;\n', "setup impl module")
          anchor = '#[cfg(target_os = "windows")]\npub use setup::SETUP_VERSION;\n'
          s = must_replace(s, anchor, anchor + '#[cfg(target_os = "windows")]\n#[doc(hidden)]\npub fn run_setup_helper_main() -> anyhow::Result<()> {\n    setup_impl::main()\n}\n', "helper export")
          p.write_text(s)

          (ws / "bin/setup_main/main.rs").write_text('#[cfg(target_os = "windows")]\nfn main() -> anyhow::Result<()> {\n    codex_windows_sandbox::run_setup_helper_main()\n}\n\n#[cfg(not(target_os = "windows"))]\nfn main() {\n    panic!("codex-windows-sandbox-setup is Windows-only");\n}\n')

          p = ws / "setup.rs"
          s = p.read_text()
          s = must_replace(s, 'use crate::setup_error::read_setup_error_report;\n', 'use crate::setup_error::read_setup_error_report;\nuse crate::setup_impl::Payload as ElevationPayload;\nuse crate::setup_impl::SetupMode;\n', "payload imports")
          a = s.index("#[derive(Serialize)]\nstruct ElevationPayload")
          b = s.index("#[derive(Debug, Clone, PartialEq, Eq)]\npub(crate) struct OfflineProxySettings", a)
          s = s[:a] + s[b:]
          refresh = s.index("fn run_setup_refresh_inner(")
          a = s.index("    let json = serde_json::to_vec(&payload)?;", refresh)
          b = s.index("#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct SetupMarker", a)
          tail = '''    let json = serde_json::to_vec(&payload)?;
              let singleflight_key = BASE64_STANDARD.encode(json);
              run_setup_singleflight(singleflight_key, || {
                  run_setup_refresh_payload(&payload, request.codex_home)
              })
          }

          fn run_setup_refresh_payload(payload: &ElevationPayload, codex_home: &Path) -> Result<()> {
              let sbx_dir = sandbox_dir(codex_home);
              let cleared_report = match clear_setup_error_report(codex_home) {
                  Ok(()) => true,
                  Err(err) => {
                      log_note(&format!("setup refresh: failed to clear setup_error.json before execution: {err}"), Some(&sbx_dir));
                      false
                  }
              };
              log_note("setup refresh: running in-process", Some(&sbx_dir));
              let started_at = std::time::Instant::now();
              let result = crate::setup_impl::run_payload(payload);
              log_note(
                  &format!("setup refresh in-process execution: completed success={} elapsed_ms={:.3}", result.is_ok(), started_at.elapsed().as_secs_f64() * 1000.0),
                  Some(&sbx_dir),
              );
              if result.is_err() {
                  return Err(report_helper_failure(codex_home, cleared_report, Some(1)));
              }
              if let Err(err) = clear_setup_error_report(codex_home) {
                  log_note(&format!("setup refresh: failed to clear setup_error.json after success: {err}"), Some(&sbx_dir));
              }
              Ok(())
          }

          '''
          s = s[:a] + tail + s[b:]
          s = must_replace(s, "fn find_setup_exe() -> PathBuf {", "pub(crate) fn find_setup_exe() -> PathBuf {", "setup exe resolver")
          p.write_text(s)

          p = root / "codex-rs/core/tests/windows_apply_patch_baseline.rs"
          s = p.read_text()
          s = must_replace(s, '    setup_refresh_child_execution_ms: Option<f64>,\n', '    setup_refresh_execution_ms: Option<f64>,\n    setup_refresh_child_spawns: usize,\n', "stats fields")
          s = must_replace(s, '    setup_refresh_child_execution_ms: f64,\n    setup_refresh_orchestration_estimated_ms: f64,\n', '    setup_refresh_execution_ms: f64,\n    setup_refresh_overhead_ms: f64,\n    setup_refresh_child_spawns: usize,\n', "result fields")
          a = s.index("    let setup_refresh_child_execution_ms = stats")
          b = s.index("    let sandbox_prepare_total_ms = stats", a)
          timing = '    anyhow::ensure!(\n        stats.setup_refresh_child_spawns == 0,\n        "{operation} expected refresh-only setup to execute in-process, got {} child spawns",\n        stats.setup_refresh_child_spawns\n    );\n    let setup_refresh_execution_ms = stats\n        .setup_refresh_execution_ms\n        .with_context(|| format!("missing setup refresh in-process execution timing for {operation}"))?;\n'
          s = s[:a] + timing + s[b:]
          s = must_replace(s, '        setup_refresh_child_execution_ms,\n        setup_refresh_orchestration_estimated_ms: stats.setup_refresh_total_ms\n            - setup_refresh_child_execution_ms,\n', '        setup_refresh_execution_ms,\n        setup_refresh_overhead_ms: stats.setup_refresh_total_ms - setup_refresh_execution_ms,\n        setup_refresh_child_spawns: stats.setup_refresh_child_spawns,\n', "result init")
          s = must_replace(s, '} else if line.contains("setup refresh child execution: completed success=") {\n            stats.setup_refresh_child_execution_ms = elapsed_ms_from_line(line);', '} else if line.contains("setup refresh in-process execution: completed success=") {\n            stats.setup_refresh_execution_ms = elapsed_ms_from_line(line);\n        } else if line.contains("setup refresh: spawning ") {\n            stats.setup_refresh_child_spawns += 1;', "log parser")
          p.write_text(s)
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Run Windows setup refresh in process"
          git push origin HEAD:perf/apply-patch-refresh-in-process-p2
