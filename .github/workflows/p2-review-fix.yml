name: Apply P2 review fixes

on:
  push:
    branches:
      - automation/p2-review-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out P2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: perf/apply-patch-refresh-in-process-p2
          fetch-depth: 1

      - name: Apply accepted review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          impl = Path('codex-rs/windows-sandbox-rs/src/setup_impl.rs')
          lines = impl.read_text(encoding='utf-8').splitlines(keepends=True)
          starts = [
              i for i, line in enumerate(lines)
              if line.strip() == 'let sandbox_group_psid = sid_bytes_to_psid(&sandbox_group_sid).map_err(|err| {'
          ]
          if len(starts) != 1:
              raise SystemExit(f'expected one sandbox_group_psid start, found {len(starts)}')
          start = starts[0]
          insert_at = next(
              i for i in range(start + 1, len(lines))
              if lines[i].strip() == 'let sandbox_group_sid_str ='
          )
          guard = [
              "    struct SandboxGroupPsidGuard(*mut c_void);\n",
              "    impl Drop for SandboxGroupPsidGuard {\n",
              "        fn drop(&mut self) {\n",
              "            unsafe {\n",
              "                if !self.0.is_null() {\n",
              "                    LocalFree(self.0 as HLOCAL);\n",
              "                }\n",
              "            }\n",
              "        }\n",
              "    }\n",
              "    let _sandbox_group_psid_guard = SandboxGroupPsidGuard(sandbox_group_psid);\n",
          ]
          lines[insert_at:insert_at] = guard

          free_ifs = [
              i for i in range(insert_at + len(guard), len(lines))
              if lines[i].strip() == 'if !sandbox_group_psid.is_null() {'
          ]
          if len(free_ifs) != 1:
              raise SystemExit(f'expected one final sandbox_group_psid free, found {len(free_ifs)}')
          free_if = free_ifs[0]
          if lines[free_if - 1].strip() != 'unsafe {' or lines[free_if + 2].strip() != '}' or lines[free_if + 3].strip() != '}':
              raise SystemExit('unexpected final sandbox_group_psid free shape')
          del lines[free_if - 1:free_if + 4]
          impl.write_text(''.join(lines), encoding='utf-8')

          setup = Path('codex-rs/windows-sandbox-rs/src/setup.rs')
          text = setup.read_text(encoding='utf-8')
          unused = 'use crate::logging::current_log_file_path;\n'
          if text.count(unused) != 1:
              raise SystemExit(f'expected one unused import, found {text.count(unused)}')
          setup.write_text(text.replace(unused, '', 1), encoding='utf-8')
          PY
          cd codex-rs
          cargo fmt --all

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-rs/windows-sandbox-rs/src/setup.rs codex-rs/windows-sandbox-rs/src/setup_impl.rs
          git diff --cached --check
          git commit -m 'Address P2 setup review feedback'
          git push origin HEAD:refs/heads/perf/apply-patch-refresh-in-process-p2
