name: temp-p2-full-cleanup-fix

on:
  push:
    branches: [perf/apply-patch-refresh-in-process-p2-main-20260904-v2]
    paths: [.github/workflows/temp-p2-full-cleanup-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove superseded full-setup PSID cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path("codex-rs/windows-sandbox-rs/src/setup_impl.rs")
          s = p.read_text()
          start = s.index("fn run_setup_full(")
          end = s.index("\n#[cfg(test)]", start)
          block = s[start:end]
          cleanup = "    unsafe {\n        if !sandbox_group_psid.is_null() {\n            LocalFree(sandbox_group_psid as HLOCAL);\n        }\n    }\n"
          if block.count(cleanup) != 1:
              raise SystemExit(f"expected one full-setup manual cleanup, got {block.count(cleanup)}")
          block = block.replace(cleanup, "", 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
      - name: Format and publish corrected tree
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs && cargo fmt --all && cd ..
          rm .github/workflows/temp-p2-full-cleanup-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove superseded full setup PSID cleanup"
          git push origin HEAD
