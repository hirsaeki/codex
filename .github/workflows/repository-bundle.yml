name: repository-bundle

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, '[repository-bundle]')
      )
    name: create repository bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select branch
        id: select
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ref="$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            requested="${ISSUE_TITLE#\[repository-bundle\]}"
            requested="$(printf '%s' "$requested" | xargs)"
            if [[ -n "$requested" ]]; then
              ref="$requested"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.select.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create git bundle
        id: bundle
        shell: bash
        env:
          REF: ${{ steps.select.outputs.ref }}
        run: |
          commit="$(git rev-parse HEAD)"
          git bundle create "$RUNNER_TEMP/repo.bundle" "refs/heads/$REF"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify git bundle
        run: git bundle verify "$RUNNER_TEMP/repo.bundle"

      - name: Split git bundle
        shell: bash
        run: |
          mkdir -p bundle-parts
          split -n 8 -d -a 2 "$RUNNER_TEMP/repo.bundle" bundle-parts/repo.bundle.part-
          ls -lh bundle-parts

      - name: Upload git bundle part 00
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-00
          path: bundle-parts/repo.bundle.part-00
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 01
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-01
          path: bundle-parts/repo.bundle.part-01
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 02
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-02
          path: bundle-parts/repo.bundle.part-02
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 03
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-03
          path: bundle-parts/repo.bundle.part-03
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 04
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-04
          path: bundle-parts/repo.bundle.part-04
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 05
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-05
          path: bundle-parts/repo.bundle.part-05
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 06
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-06
          path: bundle-parts/repo.bundle.part-06
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload git bundle part 07
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-git-bundle-${{ steps.bundle.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-part-07
          path: bundle-parts/repo.bundle.part-07
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
