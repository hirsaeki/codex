name: tmp apply-patch batch work

on:
  push:
    branches:
      - automation/apply-patch-batch-work

permissions:
  contents: read

jobs:
  compile-legacy-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply legacy diff as diagnostic baseline
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin 8118620cc9744e3f7fdf17decd3238164f818b8e
          parent="$(git rev-parse 8118620cc9744e3f7fdf17decd3238164f818b8e^)"
          git diff "$parent" 8118620cc9744e3f7fdf17decd3238164f818b8e > /tmp/legacy.patch
          git apply --3way /tmp/legacy.patch
          git status --short
          cd codex-rs
          cargo check -p codex-apply-patch -p codex-exec-server -p codex-exec-server-protocol -p codex-file-system
