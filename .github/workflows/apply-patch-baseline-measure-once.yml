name: apply-patch baseline measurement once

on:
  push:
    branches:
      - perf/instrument-apply-patch-sandbox
    paths:
      - '.github/workflows/apply-patch-baseline-measure-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  measure-windows-baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Resolve latest successful baseline build
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $branch = [uri]::EscapeDataString('perf/instrument-apply-patch-sandbox')
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/apply-patch-baseline-build.yml/runs?branch=$branch&event=push&status=success&per_page=1"
          $response = Invoke-RestMethod -Headers $headers -Uri $uri
          if (-not $response.workflow_runs -or $response.workflow_runs.Count -ne 1) {
            throw 'No successful baseline build found for perf/instrument-apply-patch-sandbox'
          }
          $run = $response.workflow_runs[0]
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "head_sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          Write-Host "Using baseline build run $($run.id) for $($run.head_sha)"

      - name: Download reusable baseline binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-apply-patch-baseline-bin-${{ steps.build.outputs.head_sha }}
          path: ${{ runner.temp }}/apply-patch-baseline-bin
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare isolated sandbox home
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP 'codex-apply-patch-baseline-home'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $codexHome
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null
          "CODEX_HOME=$codexHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:RUNNER_TEMP\apply-patch-baseline-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Measure create update delete without rebuilding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'windows-apply-patch-baseline'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $rawLog = Join-Path $artifactDir 'baseline-raw.log'
          $testExe = Join-Path $env:RUNNER_TEMP 'apply-patch-baseline-bin\windows_apply_patch_baseline.exe'

          & $testExe --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $rawLog
          $testExit = $LASTEXITCODE

          $sandboxLogDir = Join-Path $env:CODEX_HOME '.sandbox'
          if (Test-Path $sandboxLogDir) {
            Get-ChildItem -Path $sandboxLogDir -Filter 'sandbox.*.log' -ErrorAction SilentlyContinue |
              Copy-Item -Destination $artifactDir -Force
          }
          if ($testExit -ne 0) {
            exit $testExit
          }

          $current = $null
          $requestCounts = @{}
          $breakdowns = @{}
          $results = [System.Collections.Generic.List[object]]::new()
          foreach ($line in Get-Content $rawLog) {
            if ($line -match 'APPLY_PATCH_BASELINE_BEGIN (?<name>create|update|delete)') {
              $current = $Matches.name
              $requestCounts[$current] = 0
              $breakdowns[$current] = @{}
              continue
            }
            if ($null -ne $current -and $line.Contains('filesystem sandbox helper invocation started')) {
              $fsOperation = $null
              if ($line -match 'operation="(?<operation>[^"]+)"') {
                $fsOperation = $Matches.operation
              } elseif ($line -match 'operation=(?<operation>\S+)') {
                $fsOperation = $Matches.operation.Trim('"')
              }
              if ($null -ne $fsOperation) {
                $requestCounts[$current]++
                if (-not $breakdowns[$current].ContainsKey($fsOperation)) {
                  $breakdowns[$current][$fsOperation] = 0
                }
                $breakdowns[$current][$fsOperation]++
              }
              continue
            }
            if ($line -match 'APPLY_PATCH_BASELINE_RESULT (?<json>\{.*\})') {
              $row = $Matches.json | ConvertFrom-Json
              $row | Add-Member -NotePropertyName fs_requests -NotePropertyValue $requestCounts[$row.operation]
              $row | Add-Member -NotePropertyName fs_operations -NotePropertyValue $breakdowns[$row.operation]
              $results.Add($row)
            }
          }
          if ($results.Count -ne 3) {
            throw "expected three baseline rows, found $($results.Count)"
          }
          foreach ($row in $results) {
            if ($row.fs_requests -ne $row.fs_helper_starts) {
              throw "$($row.operation): fs request count $($row.fs_requests) did not match helper starts $($row.fs_helper_starts)"
            }
          }
          $results | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $artifactDir 'baseline.json')
          @(
            "build_sha=${{ steps.build.outputs.head_sha }}"
            "build_run_id=${{ steps.build.outputs.run_id }}"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "windows_sandbox_level=elevated"
          ) | Set-Content (Join-Path $artifactDir 'metadata.txt')

          Add-Content $env:GITHUB_STEP_SUMMARY '| operation | total apply_patch ms | fs requests | fs-helper starts | setup refreshes | setup-refresh total ms |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | ---: | ---: | ---: | ---: | ---: |'
          foreach ($row in $results) {
            Add-Content $env:GITHUB_STEP_SUMMARY ("| {0} | {1:N3} | {2} | {3} | {4} | {5:N3} |" -f $row.operation, $row.elapsed_ms, $row.fs_requests, $row.fs_helper_starts, $row.setup_refreshes, $row.setup_refresh_total_ms)
          }

      - name: Upload baseline measurement
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-apply-patch-baseline-measurement-${{ steps.build.outputs.head_sha }}
          path: ${{ runner.temp }}/windows-apply-patch-baseline
          if-no-files-found: warn
          retention-days: 14
