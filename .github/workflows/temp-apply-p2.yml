name: temp-apply-p2

on:
  push:
    branches:
      - perf/apply-patch-refresh-in-process-p2-main-20260904
    paths:
      - .github/workflows/temp-apply-p2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply validated P2 patch and remove bootstrap workflow
        shell: bash
        run: |
          cat > /tmp/p2.b64 <<'EOF'
          
          
          EOF
          tr -d '[:space:]' < /tmp/p2.b64 | base64 -d | gzip -d > /tmp/p2.patch
          git apply --index /tmp/p2.patch
          rm .github/workflows/temp-apply-p2.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Run Windows apply_patch setup refresh in process'
          git push origin HEAD
