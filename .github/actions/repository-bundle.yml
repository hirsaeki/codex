name: repository-bundle

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, '[repository-bundle]')
      )
    name: create repository bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create git bundle
        run: git bundle create "$RUNNER_TEMP/repo.bundle" --all

      - name: Verify git bundle
        run: git bundle verify "$RUNNER_TEMP/repo.bundle"

      - name: Upload git bundle
        uses: actions/upload-artifact@v7
        with:
          name: research-loom-git-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repo.bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0